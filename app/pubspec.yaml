name: lenden_tracker
description: "A private encrypted loan ledger for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^18.1.1

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # ── Encrypted local database ─────────────────────────────────────────────────
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # ── Secure key storage ───────────────────────────────────────────────────────
  flutter_secure_storage: ^11.2.0

  # ── Contacts & permissions ───────────────────────────────────────────────────
  flutter_contacts: ^2.6.0
  permission_handler: ^13.0.2

  # ── Sharing & files ──────────────────────────────────────────────────────────
  share_plus: ^13.3.1
  file_picker: ^13.2.0

  # ── Screenshot for WhatsApp reminder card ────────────────────────────────────
  screenshot: ^3.0.0

  # ── Biometric / device credential lock ──────────────────────────────────────
  local_auth: ^3.0.2

  # ── Internationalisation & formatting ────────────────────────────────────────
  intl: ^0.20.3

  # ── CSV export ───────────────────────────────────────────────────────────────
  csv: ^8.0.0

  # ── Cryptography for portable encrypted backup ───────────────────────────────
  cryptography: ^2.7.0

  # ── Preferences (theme, last-backup date) ───────────────────────────────────
  shared_preferences: ^2.3.3

  # ── UI utilities ─────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  cupertino_icons: ^2.0.0
  url_launcher: ^6.3.3
  dlibphonenumber: ^1.1.74

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.4.13

flutter:
  default-flavor: standard
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
